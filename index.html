<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Projeto Noiva">
<meta name="theme-color" content="#FBF7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1518" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Projeto Noiva</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --cardio:#4A90C2;--cardiobg:#E2EEF7;
  --bg:#FBF7F4;--card:#FFFFFF;--ink:#2A1F24;--mut:#7D6C72;--line:#ECE1DD;
  --acc:#9B4A62;--accbg:#F5E7EA;--acc-ink:#FFFFFF;
  --ok:#4F8562;--okbg:#E4EFE7;--warn:#B7862A;--warnbg:#FAF0DA;
  --bad:#B4544A;--badbg:#F6E2DF;--rest:#8C95A1;--restbg:#EDEFF2;
  --shadow:0 1px 2px rgba(60,30,40,.06),0 4px 14px rgba(60,30,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1518;--card:#251D21;--ink:#F3EAEC;--mut:#B3A2A8;--line:#3A2E33;
  --acc:#E08CA5;--accbg:#3D2730;--acc-ink:#1B1518;
  --ok:#86C49A;--okbg:#1F3326;--warn:#E3B860;--warnbg:#3A3020;
  --bad:#E5897D;--badbg:#3E2422;--rest:#A9B2BD;--restbg:#2B2F35;
  --shadow:none;--cardiobg:#1E2C38;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.55}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:22px}h3{font-size:17px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.tag.rest{background:var(--restbg);color:var(--rest)}
.hero{background:linear-gradient(135deg,var(--acc),#C7798F);color:#fff;border:0}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#7A3A4E,#A65A72)}}
.hero .big{font-family:Fraunces,serif;font-size:40px;line-height:1;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:18px}
.pillbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:600}
.choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.choice.on{border-color:var(--acc);background:var(--accbg)}
.choice.on .dot{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.choice.on.skip{border-color:var(--bad);background:var(--badbg)}
.choice.on.skip .dot{background:var(--bad);border-color:var(--bad)}
.choice small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.warn{background:var(--warnbg);color:var(--ink)}
.note.bad{background:var(--badbg)}
.note.ok{background:var(--okbg)}
.note.acc{background:var(--accbg)}
details.ex{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
details.ex>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
details.ex>summary::-webkit-details-marker{display:none}
details.ex .body{padding:0 14px 12px}
.cnt{margin-left:auto;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--restbg);color:var(--rest);white-space:nowrap}
.cnt.done{background:var(--okbg);color:var(--ok)}
.set{display:grid;grid-template-columns:22px 1fr 26px 1fr 34px 42px;gap:6px;align-items:center;margin-top:6px}
.set .n{font-weight:700;color:var(--mut);font-size:13px}
.set .u{font-size:12px;color:var(--mut)}
.set input{padding:8px;text-align:center}
.chk{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;color:var(--mut)}
.set.ok .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600}
.chip.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:4px 0;text-align:left;font-weight:600}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--acc)}
.toggle.on .sw:after{left:21px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.savebar.show{opacity:.92}
.savebar.err{background:var(--bad);color:#fff}
.updbar{position:fixed;left:16px;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;z-index:30;display:none;align-items:center;gap:10px;background:var(--acc);color:var(--acc-ink);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-size:14px;font-weight:600}
.updbar.show{display:flex}
.updbar span{flex:1;line-height:1.3}
.updbar button{border:0;background:var(--acc-ink);color:var(--acc);border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
#tabs .in{display:flex;max-width:560px;width:100%}
#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:12px}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--acc)}
.week{display:grid;gap:8px}
.wday{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;text-align:left}
.wday.today{border-color:var(--acc)}
.wday .d{width:42px;text-align:center;flex:none}
.wday .d b{display:block;font-family:Fraunces,serif;font-size:20px;line-height:1}
.wday .d span{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;margin-left:auto}
.st.feito{background:var(--okbg);color:var(--ok)}
.st.pulado{background:var(--badbg);color:var(--bad)}
.st.descanso{background:var(--restbg);color:var(--rest)}
.st.pend{background:var(--warnbg);color:var(--warn)}
.st.fut{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .h{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;position:relative;padding:0}
.cal button.x{visibility:hidden}
.cal button.out{opacity:.35}
.cal button.feito{background:var(--ok);border-color:var(--ok);color:#fff}
.cal button.pulado{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.cal button.descanso{background:var(--restbg);border-color:var(--restbg);color:var(--rest)}
.cal button.plan{border:1.5px dashed var(--acc)}
.cal button.today{outline:2.5px solid var(--ink);outline-offset:1px}
.cal button .mk{position:absolute;top:2px;right:4px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.mbars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}
.mbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mbars .b{width:100%;background:var(--accbg);border-radius:6px 6px 2px 2px;position:relative;min-height:2px}
.mbars .b i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:6px 6px 2px 2px}
.mbars span{font-size:10.5px;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:11px 16px;font-weight:700;width:100%}
.btn.sec{background:var(--accbg);color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label,.fld{font-size:12.5px;color:var(--mut);font-weight:600}
.banner{background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
ul.g{padding-left:18px;margin:6px 0}ul.g li{margin:4px 0}
.demo{background:var(--bg);border-radius:12px;padding:8px 10px 10px;margin:8px 0 4px}
.anim{display:block;width:100%;max-width:260px;margin:0 auto;aspect-ratio:200/140}
.anim.sm{width:96px;flex:none;margin:0;background:var(--bg);border-radius:10px}
.yt{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--acc);text-decoration:none}
.gex{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.gex:last-child{border-bottom:0}
.bi{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 -4px}
.meals{display:grid;gap:6px;margin-top:10px}
.meal{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;text-align:left;font-weight:600;font-size:14px}
.meal .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.meal.on{border-color:var(--ok);background:var(--okbg)}
.meal.on .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.meal small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.wbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.wbar>i{display:block;height:100%;background:#4A90C2;border-radius:99px}
details.gd{border-top:1px solid var(--line);padding:8px 0}
details.gd summary{font-weight:700;cursor:pointer;font-size:14px}
.st.cardio{background:var(--cardiobg);color:var(--cardio)}
.cal button.cardio{background:var(--cardiobg);border-color:var(--cardio);color:var(--cardio)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.slot{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line)}
.slot .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px}
.slot.on{border-color:var(--ok);background:var(--okbg)}
.slot.on .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.slot small{color:var(--mut);font-weight:500}
.pill2{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--restbg);color:var(--rest)}
.pill2.ok{background:var(--okbg);color:var(--ok)}
.hist div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
@supports(-webkit-touch-callout:none){input,textarea,select{font-size:16px}}
#app{padding-top:calc(16px + env(safe-area-inset-top))}
html{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="app"></div>
<div class="savebar" id="savebar"></div>
<div class="updbar" id="updbar" role="status"><span>Nova versão do app disponível.</span><button id="updbtn">Atualizar</button></div>
<nav id="tabs"><div class="in">
  <button data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
  <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Semana</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>Progresso</button>
  <button data-tab="guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>Guia</button>
</div></nav>

<script>
/* ================= DADOS DO PLANO (da planilha) ================= */
const START='2026-11-13', WED='2027-11-13';
const FICHAS={
  ultimate:{nome:'Upper Ultimate (academia)',vol:'12 séries',dur:'20 min + 30 min de esteira',
    uso:'Treino de 50 min: 20 min de musculação em dois bisets e depois 30 min de esteira. Se não puder ir, faça a aula Upper da Tônus em outro dia, evitando superiores em dias seguidos.',
    roteiro:[['0–2 min','1 série leve de aquecimento na puxada'],['2–11 min','Biset A: puxada alta + elevação lateral (3 voltas)'],['11–20 min','Biset B: remada apoiada + tríceps na polia (3 voltas)'],['20–50 min','Esteira inclinada, esforço moderado'],['Extra','Biset C só se sobrar tempo (cerca de 6 min)']],
    ex:[
    {h:'puxada',nome:'Puxada alta frontal',s:3,r:'8–12',d:'0 s (siga para a elevação lateral)',t:'Puxar em direção à parte alta do peito; controlar a volta. Antes, faça 1 série leve de aquecimento.',rir:'1–3',bi:'A',bi1:1},
    {h:'elev_lateral',nome:'Elevação lateral',s:3,r:'12–15',d:'90 s após o par',t:'Subir até altura confortável, sem balanço.',rir:'1–2',bi:'A'},
    {h:'remada_apoiada',nome:'Remada articulada ou apoiada',s:3,r:'8–12',d:'0 s (siga para o tríceps)',t:'Evitar impulso; conduzir cotovelos para trás, um pouco abertos, para trabalhar também a parte de trás do ombro.',rir:'1–3',bi:'B',bi1:1},
    {h:'triceps_polia',nome:'Tríceps na polia',s:3,r:'10–15',d:'90 s após o par',t:'Cotovelos estáveis; extensão controlada.',rir:'1–2',bi:'B'},
    {h:'crucifixo_inv',nome:'Crucifixo inverso (máquina/cabo)',s:2,r:'12–15',d:'0 s (siga para a rosca)',t:'Extra. Ênfase no deltoide posterior; não encolher os ombros.',rir:'1–2',bi:'C',bi1:1,opt:1},
    {h:'rosca_martelo',nome:'Rosca martelo',s:2,r:'10–12',d:'60 s após o par',t:'Extra. Punhos neutros e sem balançar o tronco.',rir:'1–2',bi:'C',opt:1}]},
  lower:{nome:'Plano B Lower',vol:'12 séries',dur:'20 min + 30 min de esteira',
    uso:'Substitui a aula Lower. Treino de 50 min: 20 min de musculação em dois bisets e depois 30 min de esteira. Se as pernas estiverem muito cansadas, reduza a inclinação da esteira ou corte 1 série de cada exercício.',

    ex:[

    {h:'abducao',nome:'Abdução de quadril',s:3,r:'15–20',d:'90 s após o par',t:'Sem embalo; pausa breve na abertura.',rir:'1–2',bi:'A'},
    {h:'romeno',nome:'Levantamento romeno com halteres',s:3,r:'8–12',d:'0 s (siga para a extensora)',t:'Quadril para trás, coluna neutra, sem buscar amplitude à custa da técnica.',rir:'1–3',bi:'B',bi1:1},
    {h:'extensora',nome:'Cadeira extensora',s:3,r:'10–15',d:'90 s após o par',t:'Movimento controlado, sem impulso.',rir:'1–2',bi:'B'},
    {h:'flexora',nome:'Mesa flexora',s:2,r:'10–15',d:'60 s',t:'Extra. Controle na descida.',rir:'1–2',bi:'C',bi1:1,opt:1}]},
  upperA:{nome:'Plano B Upper A',vol:'11 séries',dur:'20 min + 30 min de esteira',
    uso:'Substitui a aula Upper. Treino de 50 min: 20 min de musculação em dois bisets e depois 30 min de esteira. A quinta continua sendo Upper Ultimate, então mantenha esforço controlado e não acrescente séries.',
    roteiro:[['0–2 min','1 série leve de aquecimento na puxada'],['2–11 min','Biset A: puxada + supino (3 voltas; na 3ª, só puxada)'],['11–20 min','Biset B: remada baixa + elevação lateral (3 voltas)'],['20–50 min','Esteira inclinada, esforço moderado'],['Extra','Biset C só se sobrar tempo (cerca de 5 min)']],
    ex:[
    {h:'puxada',nome:'Puxada alta',s:3,r:'8–12',d:'0 s (siga para o supino)',t:'Costas; não puxar atrás da nuca. Antes, faça 1 série leve de aquecimento.',rir:'1–3',bi:'A',bi1:1},
    {h:'supino',nome:'Supino máquina ou halteres',s:2,r:'8–12',d:'90 s após o par',t:'Peito e equilíbrio da cintura escapular. Na 3ª volta do biset, faça só a puxada.',rir:'1–3',bi:'A'},

function weekInfo(mon){
  const t=todayK(),sl={};let forca=0,cardio=0,cmin=0,rest=0,vel=0,ref=0,ag=[],en=[],supSeq=false,infSeq=false,prevG=null;
  for(let i=0;i<7;i++){const k=addDays(mon,i);if(k<START||k>WED){prevG=null;continue}
    const a=act(k),d=D[k]||{};
    if(FORCA(a)){forca++;let slot=null;
      if(a.m==='academia'){slot={ultimate:'ultimate',lower:'lower',gluteos:'gluteos',upperA:'upper2'}[a.s];if(slot==='ultimate'&&sl.ultimate)slot='upper2'}
      else{slot=a.s==='full'?(['upper2','lower','gluteos'].find(x=>!sl[x])||null):{lower:'lower',gluteos:'gluteos',upper:'upper2'}[a.s]}
      if(slot&&!sl[slot])sl[slot]=k}
    if(a&&a.m==='velocity')vel++;
    if(cardioDay(k)){cardio++;cmin+=(d.cardio&&d.cardio.min)||0}
    if(((a&&a.m==='descanso')||(!a&&k<t))&&!cardioDay(k))rest++;
    const g=GRP(a);
    if(g&&prevG){const S=x=>x==='sup'||x==='full',I=x=>x==='inf'||x==='full';if(S(g)&&S(prevG))supSeq=true;if(I(g)&&(I(prevG)||prevG==='vel'))infSeq=true}
    prevG=g;
    if(d.ref)ref+=Object.keys(d.ref).length;if(d.agua)ag.push(d.agua);if(d.energia)en.push(d.energia);

}
function sugestao(k){
  const mon=monday(k),w=weekInfo(mon),gy=GRP(act(addDays(k,-1)));
  const falta=SLOTS.map(x=>x[0]).filter(x=>!w.sl[x]);

  const low=[0,1,2].every(i=>{const d=D[addDays(k,-i-1)];return d&&d.energia&&d.energia<=2});
  if(low)return{txt:'Sua energia está baixa há 3 dias. Hoje, descanso ou só esteira leve.'};
  if(!w.rest&&restam===1)return{txt:'Último dia da semana e você ainda não descansou: hoje é dia de descanso.'};
  if(!falta.length)return{txt:'Meta de força da semana cumprida. Hoje: esteira, Velocity ou descanso.'};
  const bloqueado=x=>{const g=(x==='lower'||x==='gluteos')?'inf':'sup';return gy===g||gy==='full'||(g==='inf'&&gy==='vel')};
  const c=falta.find(x=>!bloqueado(x));

  if(falta.length+(w.rest?0:1)>restam)txt+=' Não cabe tudo até domingo: priorize o Upper Ultimate e mantenha um dia de descanso.';

}

  document.querySelectorAll('svg[data-anim]').forEach(el=>{const r=el.getBoundingClientRect();if(!r.width||r.bottom<0||r.top>innerHeight)return;
    el.innerHTML=animFrame(el.dataset.anim,REDUCE?AT*.55:ts)});
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){
  let updW=null,updClicked=false;
  const offer=w=>{if(!w||!navigator.serviceWorker.controller)return;updW=w;document.getElementById('updbar').classList.add('show')};
  document.getElementById('updbtn').addEventListener('click',()=>{if(!updW)return;updClicked=true;flushAll();document.querySelector('#updbar span').textContent='Atualizando...';setTimeout(()=>updW.postMessage({type:'SKIP_WAITING'}),300)});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updClicked){updClicked=false;location.reload()}});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)})});
    // o iPhone deixa o app suspenso: procura versão nova toda vez que ele volta para a tela
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{})});
}
</script>
</body>
